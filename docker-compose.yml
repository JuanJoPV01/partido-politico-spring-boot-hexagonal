services:
  db:
    image: postgres:16-alpine
    container_name: partido-politico-db
    environment:
      POSTGRES_DB: partido_politico_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d partido_politico_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: partido-politico-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/partido_politico_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: